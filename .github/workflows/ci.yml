# CI for AIDE-SAI.
#
# WHAT THIS CAN AND CANNOT COVER. GitHub's runners have no GPU and not the ~23 TB
# CESM archive, so the physics validation does not run here. Three scripts in
# scripts/validation/ are self-contained and run below: test_conservation.py
# (builds its fields from np.random.default_rng(seed)), test_physics_math.py
# (closed-form settling physics) and test_configs.py (the linking presets). The
# rest need a GPU, the CESM archive, a run checkpoint or the submodules, and are
# run on the box (docs/VALIDATION.md).
#
# That makes this a thin slice, deliberately: it checks that the tree still
# imports, that transport still conserves mass and that every preset is valid. Worth having anyway --
# a tree once shipped in which 4 of 5 validation harnesses could not even start
# (broken import prologues), and a job that merely imports each module would
# have caught it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests (presets, advection conservation, settling physics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # NOT requirements.txt: that pulls cartopy, netCDF4 and matplotlib, none of
      # which this test touches, and cartopy alone dominates the install. The
      # test needs jax, jaxlib and numpy. The CPU jax wheel is the right one here
      # -- there is no GPU on the runner.
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install "jax>=0.6.2" "jaxlib>=0.6.2" "numpy>=2.0"

      # settling.py imports cleanly on its own (jax + numpy only). coupling.py,
      # radiation.py and scripts/utils/plot_run.py cannot be imported here: the first two need
      # the tomas-jax / jax-rrtmgp submodules, which this job does not check out,
      # and plot_run needs cartopy.
      #
      # PYTHONPATH is needed since the 2026-08-27 move into src/. The modules keep
      # flat top-level names -- src/_paths.py is what puts each src/ subdirectory
      # on sys.path -- but nothing has imported _paths at this point, so the one
      # directory this check needs has to be named explicitly.
      - name: import check
        run: PYTHONPATH=src/settling python -c "import settling; print('settling imports OK')"

      # Both exit 1 on any failure (see their FAILED lists), so the job status is
      # real. ~12 s and ~2 s on CPU.
      - name: advection conservation
        run: python scripts/validation/test_conservation.py

      # Closed-form physics in settling.py: Tang density, wet growth factor,
      # slip-corrected fall speed, and the implicit sweep's conservation
      # identity. The only physics in the tree with no GPU/CESM/tomas-jax
      # dependency, hence the only physics CI can reach.
      - name: settling physics
        run: python scripts/validation/test_physics_math.py

      # Every linking preset in configs/ parses with run_prod.py's own loader,
      # pins each model slot to exactly the commit the superproject records for
      # that submodule, and names patches that exist. Needs no submodule
      # checkout (git ls-files --stage reads the gitlinks); full history is not needed.
      - name: linking presets
        run: python scripts/validation/test_configs.py

      # The yearly SO2 injection schedule (INJ_SO2_SCHED_FILE): the shipped
      # file parses, the rate steps on the 365-day boundary and holds the last
      # row, the checkpoint checksum tells schedules apart, bad files are refused.
      - name: injection schedule
        run: python scripts/validation/test_inj_schedule.py

      # The radiation reference cache refuses a live met source (jcm_online):
      # its reference solve depends on the run, not on the archive hour.
      - name: reference cache guard
        run: python scripts/validation/test_rad_cache_guard.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: install ruff
        run: pip install ruff

      # ERRORS ONLY, on purpose: syntax errors (E9) and undefined or misused
      # names (F63, F7, F82). Style rules are NOT enabled, and import sorting
      # (I001) must stay off -- several modules here deliberately run
      # sys.path.insert() before importing what that insert makes importable, so
      # "organize imports" would hoist those imports above the path setup and
      # break the tree. 33 of the 77 findings from a default ruff run are that
      # rule, and every one of them is a false positive for this layout.
      # --exclude models: the dependency submodules live under models/ since
      # 2026-08-27. CI does not check them out (no `submodules: true` -- nothing
      # in this job needs them), so they are empty here, but a developer running
      # `ruff check .` locally would otherwise lint upstream repos this
      # project does not own.
      - name: ruff
        run: ruff check --select=E9,F63,F7,F82 --exclude models .
